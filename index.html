<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search</title>
<style>
html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:Arial,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;background:radial-gradient(circle at 50% 40%,#1b2a6b,#0b1026 70%);color:#fff;overflow:hidden}
.page{position:absolute;inset:0;transition:opacity .6s}.off{opacity:0;pointer-events:none}
/* 애니메이션 슬롯(두 페이지 동일 위치) */
.slot{position:absolute;left:600px;top:130px;width:400px;height:400px}
.pl{position:absolute;left:130px;top:130px;width:140px;height:140px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#7fd1ff,#2a5bd7 60%,#10236b);box-shadow:0 0 50px #4a8cff88;animation:bob 4s ease-in-out infinite}
.orb{position:absolute;inset:40px;border:2px dashed #fff4;border-radius:50%;animation:spin 8s linear infinite}
.orb i{position:absolute;left:50%;top:-12px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#ffd36b;box-shadow:0 0 20px #ffd36b}
@keyframes bob{50%{transform:translateY(-16px)}}@keyframes spin{to{transform:rotate(360deg)}}
.a2 .pl{animation:warp 3s ease-in forwards}.a2 .orb{animation-duration:.6s}   /* 애니메이션2 */
@keyframes warp{to{transform:scale(7);filter:brightness(3)}}
.a3 .pl{background:radial-gradient(circle at 35% 30%,#ffb3e6,#c13ad7 60%,#4a106b);animation:pulse 2.5s infinite}  /* 애니메이션3 */
@keyframes pulse{50%{transform:scale(1.15)}}
#q{position:absolute;left:400px;top:600px;width:800px;height:60px;box-sizing:border-box;border-radius:30px;border:0;padding:0 30px;font-size:22px;outline:0;box-shadow:0 1px 6px #2124;transition:box-shadow .2s}
#q:focus,#q:hover{box-shadow:0 2px 14px #8ab4f8aa}
#lock{position:absolute;inset:0;display:none;z-index:9;cursor:wait}
#img{position:absolute;left:640px;top:337.5px;width:320px;height:225px;border-radius:12px;object-fit:cover}  /* 1/5 x 1/4 */
#msg{position:absolute;bottom:40px;width:100%;text-align:center;color:#fffa}
#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity 2.8s ease-in 0s}
</style></head><body>
<div id="stage">
 <div id="p1" class="page"><div class="slot" id="s"><div class="orb"><i></i></div><div class="pl"></div></div>
  <input id="q" placeholder="검색어를 입력하고 Enter" autocomplete="off" maxlength="200">
  <div id="msg">화면을 클릭하면 사운드가 시작됩니다</div><div id="lock"></div></div>
 <div id="p2" class="page off"><div class="slot a3"><div class="pl"></div></div><img id="img" alt=""></div>
 <div id="fl"></div>
</div>
<script src="db.js"></script>
<script>
// 고정 비율(16:9) 스케일
const $=id=>document.getElementById(id);
const fit=()=>$('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1600,innerHeight/900)})`;
addEventListener('resize',fit);fit();
// 더미 이미지: 실제 이미지로 바꾸려면 src="images/page2.jpg" 처럼 교체
$('img').src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="225"><rect width="320" height="225" fill="#fc5c7d"/><text x="160" y="118" font-size="20" fill="#fff" text-anchor="middle" font-family="Arial">DUMMY</text></svg>');

// ---- 오디오 (합성음; 파일로 바꾸려면 new Audio('sound/bgm.mp3') 등으로 교체) ----
let ac,m;
const tone=(f,d,type='sine',v=.3,t=0)=>{const T=ac.currentTime+t,o=ac.createOscillator(),g=ac.createGain();
 o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(1e-4,T+d);o.connect(g);g.connect(m);o.start(T);o.stop(T+d)};
const sfx1=()=>ac&&(tone(520,.15),tone(780,.2,'sine',.3,.07));
const sfx2=()=>ac&&tone(900+Math.random()*300,.08,'square',.1);
function audio(){if(ac)return;ac=new AudioContext();m=ac.createGain();m.gain.value=.5;m.connect(ac.destination);ac.resume();
 const ch=[[220,262,330],[175,220,262],[262,330,392],[196,247,294]];let n=0;   // 배경음 상시 루프
 setInterval(()=>tone(ch[(n>>3)%4][n++%3],.9,'sine',.12),450);$('msg').textContent=''}
['pointerdown','keydown'].forEach(e=>addEventListener(e,audio));

// ---- 동작 ----
let busy=0;
$('q').onfocus=()=>busy||sfx1();
$('q').oninput=()=>busy||sfx2();
$('q').onkeydown=async e=>{
 const v=$('q').value.trim();if(e.key!=='Enter'||!v||busy)return;
 busy=1;$('lock').style.display='block';$('q').disabled=true;audio();   // 애니메이션2 동안 조작 잠금
 const ok=saveValue(v);                                                  // 저장은 애니메이션과 병렬
 $('s').classList.add('a2');$('fl').style.opacity=1;                      // 애니메이션1 → 2
 if(ac){const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(120,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(1600,ac.currentTime+2.8);g.gain.value=.15;o.connect(g);g.connect(m);o.start();o.stop(ac.currentTime+3)}
 await new Promise(r=>setTimeout(r,3000));
 $('p1').classList.add('off');$('p2').classList.remove('off');$('fl').style.cssText='transition:opacity 1s;opacity:0';  // 2번 페이지
 const r=await ok;if(r!==true){console.error('저장 실패:',r);alert('저장 실패: '+r)}
};
</script></body></html>
