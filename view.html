<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>입력값 목록</title>
<style>body{font-family:Arial,sans-serif;max-width:640px;margin:40px auto;padding:0 16px}li{padding:8px 0;border-bottom:1px solid #ddd}small{color:#888;margin-left:8px}</style>
</head><body><h2>입력된 값</h2><ul id="list"></ul>
<script src="db.js"></script>
<script>
getEntries().then(rows=>{
 const ul=document.getElementById('list');
 if(!Array.isArray(rows)||!rows.length)return ul.textContent='데이터가 없습니다.';
 rows.forEach(r=>{const li=document.createElement('li');li.textContent=r.value;   // textContent: XSS 방지
  const s=document.createElement('small');s.textContent=new Date(r.created_at).toLocaleString('ko-KR');li.append(s);ul.append(li)});
});
</script></body></html>
